{% extends "base.html" %}
{% block title %}Student Login - Student Smart Hub{% endblock %}
{% block content %}
<div class="auth-page">
  <a href="{{ url_for('index') }}" class="back-link">← Back</a>
  <div class="auth-card glass-card animate-fade-in-up">
    <div class="auth-header">
      <span class="auth-icon">🎓</span>
      <h1>Student Login</h1>
      <p>Roll No / Email & Password</p>
    </div>
    <form id="student-login-form" class="auth-form">
      <div class="input-group">
        <label>Roll No / Email</label>
        <input type="text" name="email" placeholder="e.g. 2024001 or student@hub.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="auth-options flex justify-between items-center mb-2">
        <label class="checkbox-label"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#" class="link">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary ripple btn-full">Login</button>
      <p id="login-error" class="error-msg"></p>
    </form>
  </div>
  <p class="auth-hint">Demo: student@hub.com / 2024001 — password: student123</p>
</div>
<style>
.auth-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; position: relative; }
.back-link { position: absolute; top: 24px; left: 24px; color: var(--text-secondary); text-decoration: none; }
.back-link:hover { color: var(--accent-blue); }
.auth-card { width: 100%; max-width: 420px; padding: 40px; }
.auth-header { text-align: center; margin-bottom: 28px; }
.auth-icon { font-size: 3rem; display: block; margin-bottom: 12px; }
.auth-header h1 { font-size: 1.75rem; margin-bottom: 4px; }
.auth-header p { color: var(--text-secondary); font-size: 0.9rem; }
.auth-form .btn-full { width: 100%; margin-top: 8px; }
.checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; }
.link { color: var(--accent-blue); font-size: 0.9rem; text-decoration: none; }
.error-msg { color: #ef4444; font-size: 0.875rem; margin-top: 12px; text-align: center; }
.auth-hint { margin-top: 20px; font-size: 0.8rem; color: var(--text-secondary); }
</style>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('student-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const err = document.getElementById('login-error');
  err.textContent = '';
  const data = { email: form.email.value.trim() || form.querySelector('[name="email"]').value, password: form.password.value };
  try {
    const r = await fetch('{{ url_for("student_login") }}', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const j = await r.json();
    if (j.success) window.location.href = j.redirect || '{{ url_for("student_dashboard") }}';
    else err.textContent = j.message || 'Invalid credentials';
  } catch (x) { err.textContent = 'Network error'; }
});
</script>
{% endblock %}
